# pve-s3 HAProxy — S3 endpoint VIP (T1.2).
# Installed to /etc/haproxy/haproxy.cfg on every gateway host.
# TLS terminates here; backends are the local RGW beast
# frontends on the trusted host net (7480, never exposed).
global
    log /dev/log local0
    maxconn 2048
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 300s
    timeout server 300s

frontend s3_https
    bind 10.0.2.60:443 ssl crt /etc/pve-s3/tls/s3.pem
    default_backend rgw_pool

backend rgw_pool
    balance leastconn
    option httpchk GET /
    http-check expect status 200
    server cloud1 10.0.2.51:7480 check inter 5s fall 3 rise 2
    server cloud2 10.0.2.52:7480 check inter 5s fall 3 rise 2
    server cloud3 10.0.2.53:7480 check inter 5s fall 3 rise 2
