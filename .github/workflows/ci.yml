name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y perl devscripts dpkg-dev
      - name: Lint, stub test, build .deb
        run: make test
